# GENERATO da tools/build_collections.py - NON editare a mano.
# Fonte di verita': openapi/<dominio>/api.yaml. Rigenera con `make collections`.
openapi: 3.0.3
info:
  title: Media API
  version: 0.2.0
  description: 'Dominio "media": **BFF pubblico** verso il dominio interno "source". Il FrontEnd parla

    solo con /v0/media; media orchestra source sulla rete interna e ri-mappa gli URL dei byte

    su /v0/media. base_path /v0 e'' applicato da src/app.py.

    '
servers:
- url: http://mediamanager-dev.duckdns.org/v0
  description: 'dev (staging) - reverse-proxy esterno duckdns. Usa http: l''https ha cert self-signed.'
- url: https://{coll_host}/v0
  description: coll (collaudo) - imposta coll_host (host pubblico dell'ambiente di collaudo).
  variables:
    coll_host:
      default: REPLACE_WITH_COLL_HOST
      description: Host pubblico dell'ambiente collaudo (vive nei secret, non versionato).
paths:
  /media/health:
    get:
      operationId: get_health
      tags:
      - media
      summary: Health check del dominio media
      responses:
        '200':
          description: Servizio attivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /media:
    get:
      operationId: list_media
      tags:
      - media
      summary: Lista i media (delega a source)
      description: 'Envelope paginato. Filtri **opzionali**: `type` (MIME) e `title` (esatto).

        Senza `type` restituisce **tutto** l''archivio (paginato). `audio/mp3` e'' un alias

        legacy di `audio/mpeg` e viene normalizzato (stesso insieme di risultati).

        I tipi `font/*` sono **elencabili** ma non caricabili dal dominio pubblico

        (l''upload di font avviene solo dalla rete interna, via `source`).

        '
      security:
      - ApiKeyAuth: []
      parameters:
      - name: type
        in: query
        required: false
        description: MIME type dei contenuti. Omettere per elencare tutti i tipi.
        schema:
          type: string
          enum:
          - audio/m4a
          - audio/mpeg
          - audio/mp3
          - audio/wav
          - video/mp4
          - image/png
          - image/jpeg
          - image/webp
          - font/ttf
          - font/otf
          example: audio/m4a
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Risultati paginati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPagedResponse'
        '400':
          description: Parametro `type` non valido (fuori enum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: upload_media
      tags:
      - media
      summary: Carica un nuovo media (delega l'upload a source)
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - title
              - media_type
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                media_type:
                  type: string
                  enum:
                  - audio/m4a
                  - audio/mpeg
                  - audio/mp3
                  - audio/wav
                  - video/mp4
                  - image/png
                  - image/jpeg
                  - image/webp
                duration_s:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Media creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Media gia' presente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /media/from-url:
    post:
      operationId: upload_media_from_url
      tags:
      - media
      summary: Crea un media scaricandolo da un URL (server-side)
      description: "Il server scarica il contenuto da `url` e crea il media (delegando l'archiviazione\
        \ a\nsource), evitando al client il doppio transito (download + re-upload) di file grandi.\nPensato\
        \ per gli URL pubblici di Blossom (archivio a contenuto indirizzato per hash).\n\n- `media_type`\
        \ opzionale: se assente e' **ricavato dal Content-Type** della risposta; se il\n  tipo (fornito\
        \ o rilevato) non e' fra quelli accettati -> `400` indicando il tipo rilevato.\n- **Difese SSRF**\
        \ (l'URL arriva dall'esterno): solo http/https; host che risolve su rete\n  privata/loopback/link-local\
        \ -> `400`; limite di dimensione (`413`); timeout e numero\n  massimo di redirect (rivalidati)\
        \ -> `502`.\n- Contenuto gia' presente -> `409` (come `POST /v0/media`): il client riusa il record.\n"
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - title
              properties:
                url:
                  type: string
                  format: uri
                  description: URL http/https da cui scaricare il contenuto.
                  example: https://blossom.example/ab12cd34ef56.png
                title:
                  type: string
                  example: Copertina puntata 42
                media_type:
                  type: string
                  description: MIME atteso. Se omesso, dedotto dal Content-Type della risposta.
                  enum:
                  - audio/m4a
                  - audio/mpeg
                  - audio/mp3
                  - audio/wav
                  - video/mp4
                  - image/png
                  - image/jpeg
                  - image/webp
                  example: image/png
                duration_s:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Media creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: 'Richiesta non valida: URL non consentito (schema/host non pubblico) oppure

            `media_type` (fornito o rilevato) fuori dai tipi accettati.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Media gia' presente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Contenuto oltre il limite di dimensione consentito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Download fallito (URL irraggiungibile, errore remoto o troppi redirect)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /media/{id}:
    get:
      operationId: get_media
      tags:
      - media
      summary: Metadati del singolo media
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: Metadati del media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '404':
          description: Media non trovato (nessun corpo)
  /media/{id}/content:
    get:
      operationId: get_media_content
      tags:
      - media
      summary: Byte del media (play inline o download)
      description: "Default inline; `?download=1|true|yes|on` -> allegato. media propaga il `302` di\n\
        source verso lo storage in coll/prod (resta fuori dai byte); in dev relaia i byte.\n\n**Due modi\
        \ di autenticarsi, in alternativa** (e' l'unica rotta con l'URL firmato):\n- `X-API-Key` in header\
        \ — i client server-side;\n- `?token=<signed_url>` in query — i tag del browser (`<img>`/`<audio>`/`<video>`),\
        \ che\n  non possono mandare header. Il token si legge dal campo `signed_url` di `MediaItem`\n\
        \  (`GET /media` o `GET /media/{id}`, che richiedono la chiave): vale solo per **quel**\n  media,\
        \ in sola lettura, fino a `signed_url_expires_at_s`. `?download=1` si puo'\n  aggiungere all'URL\
        \ firmato senza rifirmarlo.\n"
      security:
      - ApiKeyAuth: []
      - SignedUrlAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
      - name: download
        in: query
        required: false
        description: Se valorizzato (1|true|yes|on), forza il download come allegato.
        schema:
          type: string
          example: '1'
      - name: token
        in: query
        required: false
        description: 'Token dell''URL firmato (schema `SignedUrlAuth`). Alternativo a `X-API-Key`; ignorato

          se la chiave e'' presente. Non valido o scaduto -> `401`.

          '
        schema:
          type: string
      responses:
        '200':
          description: Byte del file (relay da source in dev); supporta Range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Contenuto parziale (risposta a una richiesta Range)
          headers:
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect verso URL pre-firmato (coll/prod)
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: Media non trovato (nessun corpo)
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    SignedUrlAuth:
      type: apiKey
      in: query
      name: token
      description: 'Token di lettura **firmato e a scadenza** per un singolo media, alternativo a

        `X-API-Key` sulla sola rotta dei byte (`GET /media/{id}/content`).


        Serve ai tag del browser (`<img src>`, `<audio src>`, `<video src>`): le richieste di

        sotto-risorsa **non portano header**, quindi con la sola chiave API riceverebbero `401`

        e il front-end dovrebbe scaricare i byte via `fetch` tenendoli in memoria, senza cache

        HTTP ne'' `Range`.


        Il token e'' un HMAC su `(id, scadenza)`: vale **solo per quel media** (l''id e'' dentro la

        firma: riusarlo altrove la invalida), **solo in lettura** e **solo fino alla scadenza**.

        Si ottiene dai campi `signed_url`/`signed_url_expires_at_s` delle risposte, che

        richiedono la chiave API: i byte non sono mai pubblici per default. Se l''ambiente non ha

        una chiave di firma configurata i campi non compaiono e nessun token e'' accettato.

        '
  schemas:
    MediaItem:
      type: object
      required:
      - id
      - title
      - filename
      - media_type
      - created_at_s
      - status
      - content_url
      - download_url
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Puntata pilota
        filename:
          type: string
          example: 2024-01-puntata-pilota.m4a
        media_type:
          type: string
          example: audio/m4a
        size_bytes:
          type: integer
          nullable: true
        duration_s:
          type: integer
          nullable: true
        created_at_s:
          type: integer
          example: 1700000000
        status:
          type: string
          enum:
          - ready
          - processing
          - error
        content_url:
          type: string
          description: URL (relativo) dei byte inline, per il player.
          example: /v0/media/1/content
        download_url:
          type: string
          description: URL (relativo) dei byte come allegato.
          example: /v0/media/1/content?download=1
        signed_url:
          type: string
          description: 'URL (relativo) dei byte **utilizzabile senza header**: porta un token firmato
            e a

            scadenza valido solo per questo media, in sola lettura. E'' il campo da mettere in

            `<img src>`/`<audio src>`/`<video src>` — `content_url` li'' riceverebbe `401`,

            perche'' il browser non allega header alle richieste di sotto-risorsa.


            Aggiungendo `&download=1` si ottiene l''allegato, senza rifirmare. **Assente** se

            l''ambiente non ha una chiave di firma configurata: in quel caso resta `content_url`

            con `X-API-Key`.

            '
          example: /v0/media/1/content?token=v1.1757600000.3QK9x1Yb0m...
        signed_url_expires_at_s:
          type: integer
          description: 'Scadenza di `signed_url` (epoch, secondi). Oltre questo istante l''URL risponde
            `401`:

            il client rilegge il media per ottenerne uno nuovo.

            '
          example: 1757600000
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    MediaPagedResponse:
      type: object
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required:
      - page
      - page_size
      - total
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 45
        total_pages:
          type: integer
          minimum: 0
          example: 3
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Messaggio leggibile che descrive l'errore.
        field:
          type: string
          description: 'Campo della richiesta che ha causato l''errore, quando individuabile

            (es. `logo_host`, `layers[2].media`). Utile per gli errori di riferimento asset.

            '
        value:
          description: Valore ricevuto per `field` (l'input che non e' stato risolto/validato).
        searched_by:
          type: string
          description: 'Come e'' stato interpretato `value` durante la risoluzione (es. `filename` o `id`):

            permette al client di capire se ha usato il campo sbagliato.

            '
    Health:
      type: object
      properties:
        status:
          type: string
