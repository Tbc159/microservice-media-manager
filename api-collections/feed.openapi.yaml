# GENERATO da tools/build_collections.py - NON editare a mano.
# Fonte di verita': openapi/<dominio>/api.yaml. Rigenera con `make collections`.
openapi: 3.0.3
info:
  title: Feed API
  version: 0.1.0
  description: "Dominio \"feed\": un **feed RSS 2.0 per ogni podcast Nostr** (NIP-F4), generato leggendo\
    \ dai\nrelay i kind `10154` (scheda del podcast) e `54` (episodi) di una chiave.\n\n## Questo dominio\
    \ e' diverso dagli altri, di proposito\n\n| | feed | gli altri domini |\n|---|---|---|\n| Autenticazione\
    \ | **nessuna** | `X-API-Key` |\n| CORS | **`*`** | origini in allowlist |\n| Cache | `Cache-Control`\
    \ + `ETag` + `304` | nessuna |\n| Limiti | **rate limit per IP** | nessuno |\n\n- **Nessuna autenticazione**:\
    \ il feed lo scaricano le app di podcast e gli aggregatori\n  (Podcast Index, Apple), che non conoscono\
    \ la chiave API. Un feed e' per definizione\n  pubblico. Il resto del servizio resta autenticato:\
    \ questa eccezione vale solo qui.\n- **Cache obbligatoria**: Podcast Index rilegge circa ogni ora,\
    \ Apple piu' spesso. Senza\n  cache ogni lettura aprirebbe WebSocket verso i relay. Il corpo e' deterministico\
    \ (nessun\n  timestamp di generazione), quindi l'`ETag` cambia **solo** se cambiano gli eventi.\n\
    - **Rate limit per IP**: e' l'unica difesa possibile su un endpoint senza credenziali.\n- **CORS `*`**:\
    \ il client verifica il feed dal browser e non c'e' nulla da proteggere in un\n  documento pubblico.\n\
    \n## Come si diagnostica un feed vuoto\nIl difetto piu' probabile non e' un bug ma un **relay sbagliato**:\
    \ gli eventi stanno altrove\ne la risposta e' un canale senza episodi. Per questo ogni feed dichiara\
    \ in testa i relay\ninterrogati (`<!-- relays: ... -->`) e il `404` li elenca nel corpo. Con `?relays=`\
    \ se ne\naggiungono altri senza toccare la configurazione.\n"
servers:
- url: http://mediamanager-dev.duckdns.org/v0
  description: 'dev (staging) - reverse-proxy esterno duckdns. Usa http: l''https ha cert self-signed.'
- url: https://{coll_host}/v0
  description: coll (collaudo) - imposta coll_host (host pubblico dell'ambiente di collaudo).
  variables:
    coll_host:
      default: REPLACE_WITH_COLL_HOST
      description: Host pubblico dell'ambiente collaudo (vive nei secret, non versionato).
paths:
  /feed/health:
    get:
      operationId: get_health
      tags:
      - feed
      summary: Health check del dominio feed
      responses:
        '200':
          description: Servizio attivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /feed/{npub}.xml:
    get:
      operationId: get_feed
      tags:
      - feed
      summary: Feed RSS 2.0 del podcast Nostr di una chiave
      description: "Genera il feed leggendo dai relay gli eventi della chiave:\n\n1. **relay** — lista\
        \ NIP-65 (kind `10002`) presa dai relay indicizzatori, piu' un elenco\n   fisso di ripiego, piu'\
        \ quelli di `?relays=`. Un relay in timeout viene ritentato una\n   volta con timeout doppio;\
        \ se non risponde comunque il feed esce **parziale** (vedi\n   `200`);\n2. **kind 10154** (scheda\
        \ del podcast, una sola versione, la piu' recente) — se manca,\n   `404`. Non viene inventato\
        \ un canale a partire dal kind `0`;\n3. **kind 0** — solo per `itunes:author` e `itunes:owner`,\
        \ se presenti;\n4. **kind 54** (episodi), ordinati per `created_at` decrescente. Zero episodi\
        \ -> `200`\n   con il canale e nessun `<item>`: un feed vuoto e' valido.\n\nGli eventi con `id`\
        \ incoerente o **firma non valida** vengono scartati: il feed accetta\nrelay dal chiamante, quindi\
        \ non puo' fidarsi di cio' che un relay restituisce.\n\n**Enclosure**: `url` e `type` vengono\
        \ dal **primo** tag `audio` con MIME `audio/*`; gli\naltri diventano `podcast:alternateEnclosure`.\
        \ Un episodio senza alcun tag `audio` viene\nsaltato e contato in un commento in coda (`<!-- saltati:\
        \ N senza audio -->`). NIP-F4 non\nporta la dimensione del file: `length` si ottiene con una `HEAD`\
        \ sull'URL, memorizzata in\ncache per URL (gli URL Blossom sono content-addressed, il valore non\
        \ cambia). Se la\n`HEAD` non riesce: `length=\"0\"` e un commento che lo dice — l'enclosure non\
        \ si omette.\n\n**Tag oltre NIP-F4.** Le piattaforme pretendono dati che NIP-F4 non prevede: Apple\
        \ e\nAmazon rifiutano un feed senza `itunes:category`; Spotify, Amazon e YouTube verificano\n\
        la proprieta' scrivendo all'`itunes:email`; il validatore W3C tratta un `itunes:owner`\nsenza\
        \ email come errore. Il client li scrive con tag semplici e qui vengono letti — tutti\nfacoltativi,\
        \ e senza di essi il comportamento non cambia:\n\n| evento | tag | diventa |\n|---|---|---|\n\
        | 10154 | `[\"category\", \"News\", \"Daily News\"]` (fino a 3, il primo e' la primaria) | `<itunes:category\
        \ text=\"News\"><itunes:category text=\"Daily News\"/></itunes:category>` |\n| 10154 | `[\"language\"\
        , \"it\"]` (ISO 639-1) | `<language>` — vince su `?lang`, che vince sul default |\n| 10154 | `[\"\
        email\", \"owner@esempio.tld\"]` | `<itunes:owner>` con `itunes:name` e `itunes:email`; **senza\
        \ email nessun owner** |\n| 10154 | `[\"content-warning\", \"...\"]` (NIP-36, anche vuoto) | `<itunes:explicit>true</itunes:explicit>`\
        \ |\n| 54 | `[\"duration\", \"3600\"]` (secondi interi) | `<itunes:duration>` |\n| 54 | `[\"content-warning\"\
        , \"...\"]` | `<itunes:explicit>true</itunes:explicit>` nell'item |\n\nI nomi delle categorie\
        \ sono quelli **esatti** di Apple, `&` compresa: la validazione\ncontro l'elenco la fa il client\
        \ prima di pubblicare, il servizio riporta cio' che trova.\n**Non si inventa**: senza tag `category`\
        \ nessun `itunes:category`, senza `email` nessun\n`itunes:owner`, senza `duration` nessun `itunes:duration`.\n"
      parameters:
      - name: npub
        in: path
        required: true
        description: Chiave pubblica, in bech32 (`npub1...`) **oppure** 64 esadecimali.
        schema:
          type: string
          pattern: ^(npub1[023456789acdefghjklmnpqrstuvwxyz]{58}|[0-9a-fA-F]{64})$
        example: npub180cvv07tjdrrgpa0j7j7tmnyl2yr6yr7l8j4s3evf6u64th6gkwsyjh6w6
      - name: lang
        in: query
        required: false
        description: 'Lingua del canale (`<language>`). NIP-F4 non prevede un campo lingua, quindi non
          e''

          deducibile dagli eventi: si dichiara qui.

          '
        schema:
          type: string
          default: it
          pattern: ^[a-zA-Z]{2}(-[a-zA-Z]{2})?$
        example: it
      - name: relays
        in: query
        required: false
        description: 'Relay aggiuntivi separati da virgola (`wss://a,wss://b`), letti **in aggiunta**
          a

          quelli scoperti. Solo `ws`/`wss` verso host pubblici; i primi 8 validi.

          '
        schema:
          type: string
        example: wss://relay.example.com,wss://altro.example.org
      responses:
        '200':
          description: 'Feed RSS 2.0 con `ETag` (hash del **contenuto**: il commento sui relay non entra).


            `Cache-Control` dice quanto vale la risposta: `public, max-age=300` se **tutti** i

            relay hanno risposto; `public, max-age=30` (o `no-cache`) se il feed e'' **parziale**,

            cioe'' costruito senza la risposta di almeno un relay. Un parziale esce comunque —

            meglio pochi episodi che un 503 — ma non va tenuto cinque minuti: chi lo verifica in

            quel momento vedrebbe sparire gli episodi che stanno solo sul relay lento. Nel

            commento in testa i relay senza risposta sono segnati `(nessuna risposta)`.

            '
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=300
            ETag:
              schema:
                type: string
              example: '"3f2b1c..."'
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
          content:
            application/rss+xml:
              schema:
                type: string
        '304':
          description: Non modificato (l'`If-None-Match` del client corrisponde all'`ETag`).
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '400':
          description: Chiave non valida (ne' bech32 ne' 64 esadecimali)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedError'
        '404':
          description: 'Nessuna scheda podcast (kind 10154) per questa chiave **sui relay interrogati**.
            Il

            corpo elenca i relay: senza, un podcast inesistente e'' indistinguibile da uno cercato

            nel posto sbagliato.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedError'
              example:
                detail: nessuna scheda podcast (kind 10154) per questa chiave sui relay interrogati
                relays:
                - wss://nos.lol
                - wss://relay.damus.io
                - wss://relay.primal.net
        '429':
          description: Troppe richieste da questo indirizzo IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedError'
components:
  schemas:
    FeedError:
      type: object
      required:
      - detail
      description: Errore del dominio feed. `relays` e' presente sul 404 ed e' la chiave diagnostica.
      properties:
        detail:
          type: string
        relays:
          type: array
          description: Relay effettivamente interrogati.
          items:
            type: string
        unreached:
          type: array
          description: 'Relay interrogati che **non hanno risposto**. Su un 404 e'' il caso peggiore:
            la

            scheda potrebbe esistere proprio li''. Presente solo se non vuoto.

            '
          items:
            type: string
    Health:
      type: object
      properties:
        status:
          type: string
