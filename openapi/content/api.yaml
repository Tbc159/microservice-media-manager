openapi: 3.0.3
info:
  title: Content API
  version: 0.2.0
  description: |
    Dominio "content": **BFF pubblico** per la *generazione di immagini* a partire da asset
    gia' caricati su /v0/media. Il campo `tipo` nel body seleziona il generatore:
    - `copertina` — template fisso (uso interno "21milioni di chiacchiere");
    - `composita` — **motore a layer**: canvas 1920x1080, lista ordinata di layer
      (sfondo, persone, testo, immagini) componibili liberamente;
    - `social` — **preset** quadrato 1080x1080 per i post;
    - `slide` — **preset** 16:9 da copertina di un video.

    I preset non sono un secondo motore: espandono i loro campi nei **layer** del motore di
    `composita` (stesse regole di posizionamento, stessi warning, stessi errori). Serve un
    layout diverso da quello del preset? Si usa `composita` e si scrivono i layer a mano.

    Gli asset (sfondi, persone, loghi, font) sono referenziati per **id media** o **nome file**
    e risolti via source sulla rete interna. L'immagine prodotta e' salvata come media `image/*`
    e se ne restituiscono gli URL per recuperarla (su /v0/media). base_path /v0 e' applicato da
    src/app.py.
servers:
  - url: /v0
    description: base path applicato da connexion

paths:
  /content/health:
    get:
      operationId: get_health
      tags: [content]
      summary: Health check del dominio content
      responses:
        '200':
          description: Servizio attivo
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Health'
              example:
                status: ok

  /content/image:
    post:
      operationId: generate_image
      tags: [content]
      summary: Genera un'immagine e la salva come media
      description: |
        Il campo `tipo` seleziona il generatore:
        - `copertina` — attivo: template fisso 2560x1440 (logo host, titolo, testo centrale,
          fino a 5 avatar ospiti). Asset per id media o nome file.
        - `composita` — attivo: **motore a layer** su canvas 1920x1080. `layers[]` ordinati
          (z-order = ordine array) di tipo `background`/`person`/`text`/`image`. Asset (incl. font)
          per id o nome file; posizione keyword/%/px; testo con `stroke`/`box`.
        - `social` — attivo: preset quadrato 1080x1080 (logo in alto, testo centrale, logo tondo
          in basso, testo inferiore opzionale).
        - `slide` — attivo: preset 16:9 da copertina video (sfondo con velo, titolo, sottotitolo,
          logo, fino a 3 ospiti ritagliati).

        `social` e `slide` sono **preset del motore a layer**: espandono i campi in `layers[]` e
        passano dallo stesso renderer, quindi condividono warning ed errori con `composita`.

        L'immagine generata e' salvata come media `image/*`; la risposta contiene gli URL
        (`content_url`/`download_url`) su /v0/media per recuperarla e gli eventuali `warnings`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageRequest'
      responses:
        '201':
          description: Immagine generata e salvata come media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedImage'
        '400':
          description: Parametri non validi, oppure asset (logo/ospite) non trovato
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'
        '501':
          description: Nessun generatore associato al `tipo` richiesto
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'

  /content/fonts:
    get:
      operationId: list_fonts
      tags: [content]
      summary: Elenco dei font disponibili per la generazione
      description: |
        Catalogo dei font (`font/ttf`/`font/otf`) caricati su source, referenziabili nei layer
        `text` (campo `font`) o in `copertina` per **id** o **nome** (risoluzione tollerante).
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Font disponibili
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FontInfo'

components:
  securitySchemes:
    ApiKeyAuth:
      $ref: '../shared/components.yaml#/components/securitySchemes/ApiKeyAuth'
  schemas:
    ImageRequest:
      description: |
        Richiesta polimorfica: il campo `tipo` discrimina il generatore.
      oneOf:
        - $ref: '#/components/schemas/CopertinaRequest'
        - $ref: '#/components/schemas/CompositaRequest'
        - $ref: '#/components/schemas/SocialRequest'
        - $ref: '#/components/schemas/SlideRequest'
      discriminator:
        propertyName: tipo
        mapping:
          copertina: '#/components/schemas/CopertinaRequest'
          composita: '#/components/schemas/CompositaRequest'
          social: '#/components/schemas/SocialRequest'
          slide: '#/components/schemas/SlideRequest'

    MediaRef:
      description: |
        Riferimento a un media gia' caricato (via `POST /v0/media`). Due forme:

        - **id** — l'intero `id` del record (`MediaItem.id`).
        - **filename** — la stringa `MediaItem.filename` (NON `title`).

        ⚠️ **`filename`, non `title`.** `MediaItem` ha due campi testuali diversi: `title`
        (il titolo *che invii tu* a `POST /v0/media`) e `filename` (il nome file, **generato
        dal servizio** dal file caricato). La risoluzione per stringa usa **solo `filename`**;
        passare il `title` NON funziona e produce `400` (vedi la risposta `400` di
        `POST /v0/content/image`, che indica il campo, il valore e che la ricerca e' per filename).

        Il `filename` **non e' quello che hai inviato**: va **riletto dalla risposta** di
        `POST /v0/media` (campo `filename`). Esempio: carichi un logo con
        `title: "Logo Bitcoin Radio"` e ricevi `{ "id": 42, "filename": "logo-bitcoin-radio.png",
        "title": "Logo Bitcoin Radio", ... }` → nei layer usi `42` **oppure**
        `"logo-bitcoin-radio.png"`, **mai** `"Logo Bitcoin Radio"`.

        Il match sul `filename` e' **tollerante**: ignora maiuscole/minuscole, l'estensione e il
        separatore (trattino/underscore/spazio), quindi `Montserrat-Bold.ttf`, `montserrat-bold`
        e `montserrat bold` coincidono. In caso di piu' corrispondenze vince la piu' recente.
      oneOf:
        - type: integer
          description: id del record (MediaItem.id).
        - type: string
          description: MediaItem.filename (generato dal servizio; NON title).
      example: 42

    CopertinaRequest:
      type: object
      required: [tipo, titolo, testo_centrale, logo_host]
      properties:
        tipo:
          type: string
          enum: [copertina]
          description: Discriminatore del tipo di immagine.
        titolo:
          type: string
          description: Titolo in alto a fianco del logo (puo' contenere \n per piu' righe).
          example: "Bitcoin Radio"
        testo_centrale:
          type: string
          description: Testo centrale (puo' contenere \n per piu' righe).
          example: "è lieto di ospitare"
        logo_host:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Logo host (id media o nome file). Deve essere un'immagine.
        ospiti:
          type: array
          maxItems: 5
          default: []
          description: Avatar ospiti (max 5), per id media o nome file. Mancanti -> placeholder.
          items:
            $ref: '#/components/schemas/MediaRef'
          example: [21, 22]
        colore_sfondo:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#ff751f"
          example: "#ff751f"
        tipo_sfondo:
          type: string
          enum: [unicolor, sfumato-up, sfumato-down]
          default: unicolor
        colore_sfumato:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
          description: Obbligatorio se `tipo_sfondo` != `unicolor`.
        formato:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          default: image/png
          description: Formato dell'immagine generata.
        font_titolo:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: |
            Font del titolo (id media o nome file di un font `font/ttf`|`font/otf`, caricato su
            source). Assente → Montserrat ExtraBold bundle. Non risolvibile → default Pillow + warning.
        font_testo:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: |
            Font del testo centrale (id media o nome file). Assente → Montserrat Light bundle.
            Non risolvibile → default Pillow + warning.

    SocialRequest:
      type: object
      description: |
        Preset `social`: immagine **quadrata 1080x1080** per i post.

        Non e' un generatore a se': i campi vengono espansi nei **layer** del motore di
        `composita` e resi dallo stesso renderer. Layout fisso, dall'alto verso il basso:
        sfondo a tinta unita (`colore_sfondo`) → `logo_top` (larghezza 50% della canvas, a
        86px dal bordo) → `testo` centrato verticalmente e reso in **MAIUSCOLO** →
        `logo_bottom` ritagliato **a cerchio** (300px, a 660px dal bordo) → `testo_bottom`
        in fondo. Serve un layout diverso? `tipo: composita`, con i layer scritti a mano.

        Asset mancanti: `logo_top` e' obbligatorio (non risolvibile → **400** diagnosticabile),
        `logo_bottom` degrada (layer saltato + `warnings`), come nel motore a layer.
      required: [tipo, logo_top]
      properties:
        tipo:
          type: string
          enum: [social]
          description: Discriminatore del tipo di immagine.
        logo_top:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Logo superiore (id media o nome file). Obbligatorio; se non risolvibile → 400.
        logo_bottom:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: |
            Logo inferiore, ritagliato a cerchio (id media o nome file). Assente o non
            risolvibile → il layer viene saltato e la risposta porta un `warnings`.
        testo:
          type: string
          default: "è lieto di ospitare"
          description: Testo centrale (reso in maiuscolo). Stringa vuota → nessun testo.
        testo_bottom:
          type: string
          nullable: true
          description: Testo inferiore opzionale.
        colore_sfondo:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#ff751f"
        colore_testo:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#ffffff"
        font:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: |
            Font dei testi (id media o nome file di un font caricato su source, vedi
            `GET /v0/content/fonts`). Assente → Montserrat bundle; non risolvibile → default
            Pillow + warning.
        formato:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          default: image/png
          description: Formato dell'immagine generata.

    SlideRequest:
      type: object
      description: |
        Preset `slide`: **copertina 16:9 (1920x1080)** di un video — il caso d'uso finora
        coperto a mano con `composita`.

        Come `social`, i campi vengono espansi nei **layer** del motore di `composita`:
        sfondo (`sfondo` a tutta canvas, `fit`) con un **velo** a tinta unita che rende
        leggibile il testo (`colore_velo` + `velo`) → fino a 3 `persone` ritagliate,
        allineate in basso → `logo` in alto a sinistra → `titolo` (con glow) → `sottotitolo`.

        `allineamento` decide l'impaginazione:
        - `left` (default) — titolo e sottotitolo a sinistra (80px dal bordo), ospiti nella
          fascia di destra;
        - `center` — titolo e sottotitolo centrati, ospiti distribuiti su tutta la larghezza.

        L'altezza degli ospiti si adatta al numero (1 → 70% della canvas, 2 → 62%, 3 → 55%) e
        titolo/sottotitolo si posizionano nello **spazio libero**: un titolo su piu' righe sale
        da solo, senza sovrapporsi al sottotitolo. Serve altro? `tipo: composita`.
      required: [tipo, titolo]
      properties:
        tipo:
          type: string
          enum: [slide]
          description: Discriminatore del tipo di immagine.
        titolo:
          type: string
          description: Titolo della copertina (puo' contenere \n; va a capo da solo se troppo lungo).
          example: "Bitcoin è denaro"
        sottotitolo:
          type: string
          nullable: true
          description: Sottotitolo opzionale sotto il titolo.
          example: "Puntata 42 — con Alice e Bob"
        sfondo:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: |
            Immagine di sfondo (id media o nome file). Assente o non risolvibile → si usa
            `colore_sfondo` (con `warnings`).
        fit:
          type: string
          enum: [cover, contain, stretch]
          default: cover
          description: Come adattare lo sfondo alla canvas.
        colore_sfondo:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#111111"
          description: Colore di fondo (usato anche come fallback dello sfondo).
        colore_velo:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#000000"
          description: Colore del velo steso sullo sfondo per la leggibilita' del testo.
        velo:
          type: number
          minimum: 0
          maximum: 1
          default: 0.45
          description: Opacita' del velo (0 = sfondo intatto, 1 = tinta piena).
        colore_testo:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#ffffff"
        dimensione_titolo:
          type: integer
          minimum: 1
          default: 110
          description: Corpo del titolo in px (il sottotitolo e' fisso a 52).
        allineamento:
          type: string
          enum: [left, center]
          default: left
          description: Impaginazione di titolo/sottotitolo e distribuzione degli ospiti.
        logo:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Logo in alto a sinistra (larghezza 260px). Non risolvibile → saltato + warning.
        persone:
          type: array
          maxItems: 3
          default: []
          description: |
            Ritagli degli ospiti (PNG con trasparenza), per id media o nome file. Oltre il terzo
            vengono ignorati. Non risolvibili → saltati + warning.
          items:
            $ref: '#/components/schemas/MediaRef'
          example: [21, 22]
        font_titolo:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Font del titolo (id o nome file). Assente → Montserrat bundle.
        font_testo:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Font del sottotitolo (id o nome file). Assente → Montserrat bundle.
        formato:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          default: image/png
          description: Formato dell'immagine generata.

    CompositaRequest:
      type: object
      description: |
        Layer-based engine on a **1920x1080** canvas. `layers` is an **ordered** list: the first
        element is the background, the others stack on top (z-order = array order). Each layer has a
        `type` (`background`/`person`/`text`/`image`) and its own fields.
      required: [tipo, layers]
      properties:
        tipo:
          type: string
          enum: [composita]
          description: Image-type discriminator (request envelope).
        formato:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          default: image/png
          description: Output image format.
        layers:
          type: array
          minItems: 1
          description: Layers to compose, from the background (first) to the top (last).
          items:
            oneOf:
              - $ref: '#/components/schemas/BackgroundLayer'
              - $ref: '#/components/schemas/PersonLayer'
              - $ref: '#/components/schemas/TextLayer'
              - $ref: '#/components/schemas/ImageLayer'
            discriminator:
              propertyName: type
              mapping:
                background: '#/components/schemas/BackgroundLayer'
                person: '#/components/schemas/PersonLayer'
                text: '#/components/schemas/TextLayer'
                image: '#/components/schemas/ImageLayer'

    # ── Positioning/style helpers shared by layers ──────────────────────────────
    PosX:
      type: string
      description: |
        Horizontal position. Keyword (`left`/`center`/`right`), percentage within the free space
        (`"0%"`=flush left, `"100%"`=flush right, `"50%"`=centered) or pixel (`"640"`/`"640px"`).
      pattern: '^(left|center|right|\d{1,3}%|\d+(px)?)$'
      default: center
    PosY:
      type: string
      description: |
        Vertical position. Keyword (`top`/`center`/`bottom`), percentage within the free space, or
        pixel.
      pattern: '^(top|center|bottom|\d{1,3}%|\d+(px)?)$'
      default: center
    Size:
      type: object
      description: |
        Target size of the layer. Values in `%` (of the matching canvas dimension) or pixel. Only
        one given → aspect ratio preserved; both absent → natural size (clamped to the canvas).
      properties:
        width:
          type: string
          pattern: '^(\d{1,3}%|\d+(px)?)$'
        height:
          type: string
          pattern: '^(\d{1,3}%|\d+(px)?)$'
    Stroke:
      type: object
      description: Text stroke (outline).
      properties:
        width:
          type: integer
          minimum: 0
          default: 0
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#000000"
    Box:
      type: object
      description: Colored box behind the text, with rounded corners and padding.
      required: [color]
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        radius:
          type: integer
          minimum: 0
          default: 0
        padding:
          type: integer
          minimum: 0
          default: 16
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
    Overlay:
      type: object
      description: |
        Velo a tinta unita steso sopra lo sfondo (dopo l'immagine, sotto gli altri layer): rende
        leggibile il testo su una foto complessa. E' quello che usa il preset `slide`.
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#000000"
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.45
    Shadow:
      type: object
      description: |
        Ombra o glow del testo. `offset {0,0}` + `blur` alto = effetto **glow/neon**;
        offset valorizzato + `blur` basso = ombra portata.
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#000000"
        offset:
          type: object
          description: Spostamento dell'ombra in px (può essere negativo).
          properties:
            x:
              type: integer
              default: 4
            y:
              type: integer
              default: 4
        blur:
          type: integer
          minimum: 0
          default: 0
          description: Raggio di sfocatura gaussiana (0 = ombra netta; alto = glow).
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1

    # ── Layers ──────────────────────────────────────────────────────────────────
    BackgroundLayer:
      type: object
      required: [type]
      description: Full-canvas background (image or color).
      properties:
        type:
          type: string
          enum: [background]
        media:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Background image (id or filename). Absent/unresolved → `fallback_color`.
        fit:
          type: string
          enum: [cover, contain, stretch]
          default: cover
          description: How to fit the image onto the canvas.
        fallback_color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#111111"
        overlay:
          $ref: '#/components/schemas/Overlay'
    PersonLayer:
      type: object
      required: [type, media]
      description: Cut-out person (PNG with transparency), positionable and scalable.
      properties:
        type:
          type: string
          enum: [person]
        media:
          $ref: '#/components/schemas/MediaRef'
        x:
          $ref: '#/components/schemas/PosX'
        y:
          $ref: '#/components/schemas/PosY'
        size:
          $ref: '#/components/schemas/Size'
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        required:
          type: boolean
          default: false
          description: If true and the asset is missing → 400. Otherwise the layer is skipped with a warning.
        mask:
          type: string
          enum: [circle]
          description: |
            Ritaglio del layer. `circle` = quadrato centrato + bordo circolare antialiasato
            (il lato e' il minore fra larghezza e altezza richieste; la posizione non cambia).
    TextLayer:
      type: object
      required: [type, content]
      description: Text, with optional font/stroke/box. `\n` for multiple lines.
      properties:
        type:
          type: string
          enum: [text]
        content:
          type: string
          example: "RASSEGNA\nSTAMPA"
        font:
          allOf:
            - $ref: '#/components/schemas/MediaRef'
          description: Font (id or filename of a font on source). Absent → bundled Montserrat.
        font_size:
          type: integer
          minimum: 1
          default: 72
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#ffffff"
        align:
          type: string
          enum: [left, center, right]
          default: left
          description: Alignment of multi-line text.
        x:
          $ref: '#/components/schemas/PosX'
        y:
          $ref: '#/components/schemas/PosY'
        max_width:
          type: integer
          nullable: true
          description: Max width in px for automatic wrapping (absent → no wrap).
        stroke:
          $ref: '#/components/schemas/Stroke'
        box:
          $ref: '#/components/schemas/Box'
        shadow:
          $ref: '#/components/schemas/Shadow'
    ImageLayer:
      type: object
      required: [type, media]
      description: Overlaid image/graphic/logo (logos, insets, effects).
      properties:
        type:
          type: string
          enum: [image]
        media:
          $ref: '#/components/schemas/MediaRef'
        x:
          $ref: '#/components/schemas/PosX'
        y:
          $ref: '#/components/schemas/PosY'
        size:
          $ref: '#/components/schemas/Size'
        opacity:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        required:
          type: boolean
          default: false
          description: If true and the asset is missing → 400. Otherwise the layer is skipped with a warning.
        mask:
          type: string
          enum: [circle]
          description: |
            Ritaglio del layer. `circle` = quadrato centrato + bordo circolare antialiasato
            (il lato e' il minore fra larghezza e altezza richieste; la posizione non cambia).

    GeneratedImage:
      type: object
      description: Esito della generazione; gli URL puntano a /v0/media per il recupero.
      required: [id, tipo, media_type, created_at_s, content_url, download_url]
      properties:
        id:
          type: integer
          description: id media dell'immagine salvata (recuperabile su /v0/media).
          example: 101
        tipo:
          type: string
          enum: [copertina, composita, social, slide]
          example: copertina
        media_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          example: image/png
        size_bytes:
          type: integer
          nullable: true
          example: 482344
        created_at_s:
          type: integer
          example: 1700000000
        content_url:
          type: string
          description: URL (relativo) dei byte inline.
          example: "/v0/media/101/content"
        download_url:
          type: string
          description: URL (relativo) dei byte come allegato.
          example: "/v0/media/101/content?download=1"
        warnings:
          type: array
          default: []
          description: |
            Avvisi non bloccanti sulla generazione. Es. font richiesto non presente → si è usato
            il font di default di Pillow. La risposta resta `201`.
          items:
            type: string
          example: ["font 'MioFont.ttf' non trovato: usato il default Pillow"]

    FontInfo:
      type: object
      description: Font disponibile per la generazione (caricato su source).
      required: [id, name, filename, media_type]
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          description: Nome leggibile (title del media).
          example: "Montserrat Black"
        filename:
          type: string
          example: "montserrat-black.ttf"
        media_type:
          type: string
          enum: [font/ttf, font/otf]
          example: font/ttf
        size_bytes:
          type: integer
          nullable: true
        created_at_s:
          type: integer
          example: 1700000000
