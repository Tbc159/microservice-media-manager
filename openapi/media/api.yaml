openapi: 3.0.3
info:
  title: Media API
  version: 0.2.0
  description: |
    Dominio "media": **BFF pubblico** verso il dominio interno "source". Il FrontEnd parla
    solo con /v0/media; media orchestra source sulla rete interna e ri-mappa gli URL dei byte
    su /v0/media. base_path /v0 e' applicato da src/app.py.
servers:
  - url: /v0
    description: base path applicato da connexion

paths:
  /media/health:
    get:
      operationId: get_health
      tags: [media]
      summary: Health check del dominio media
      responses:
        '200':
          description: Servizio attivo
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Health'
              example:
                status: ok

  /media:
    get:
      operationId: list_media
      tags: [media]
      summary: Lista i media (delega a source)
      description: |
        Envelope paginato. Filtri **opzionali**: `type` (MIME) e `title` (esatto).
        Senza `type` restituisce **tutto** l'archivio (paginato). `audio/mp3` e' un alias
        legacy di `audio/mpeg` e viene normalizzato (stesso insieme di risultati).
        I tipi `font/*` sono **elencabili** ma non caricabili dal dominio pubblico
        (l'upload di font avviene solo dalla rete interna, via `source`).
      security:
        - ApiKeyAuth: []
      parameters:
        - name: type
          in: query
          required: false
          description: MIME type dei contenuti. Omettere per elencare tutti i tipi.
          schema:
            type: string
            enum: [audio/m4a, audio/mpeg, audio/mp3, audio/wav, video/mp4, image/png, image/jpeg, image/webp, font/ttf, font/otf]
            example: audio/m4a
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Risultati paginati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPagedResponse'
        '400':
          description: Parametro `type` non valido (fuori enum)
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'
    post:
      operationId: upload_media
      tags: [media]
      summary: Carica un nuovo media (delega l'upload a source)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, media_type]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                media_type:
                  type: string
                  enum: [audio/m4a, audio/mpeg, audio/mp3, audio/wav, video/mp4, image/png, image/jpeg, image/webp]
                duration_s:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Media creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: Richiesta non valida
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'
        '409':
          description: Media gia' presente
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'

  /media/from-url:
    post:
      operationId: upload_media_from_url
      tags: [media]
      summary: Crea un media scaricandolo da un URL (server-side)
      description: |
        Il server scarica il contenuto da `url` e crea il media (delegando l'archiviazione a
        source), evitando al client il doppio transito (download + re-upload) di file grandi.
        Pensato per gli URL pubblici di Blossom (archivio a contenuto indirizzato per hash).

        - `media_type` opzionale: se assente e' **ricavato dal Content-Type** della risposta; se il
          tipo (fornito o rilevato) non e' fra quelli accettati -> `400` indicando il tipo rilevato.
        - **Difese SSRF** (l'URL arriva dall'esterno): solo http/https; host che risolve su rete
          privata/loopback/link-local -> `400`; limite di dimensione (`413`); timeout e numero
          massimo di redirect (rivalidati) -> `502`.
        - Contenuto gia' presente -> `409` (come `POST /v0/media`): il client riusa il record.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title]
              properties:
                url:
                  type: string
                  format: uri
                  description: URL http/https da cui scaricare il contenuto.
                  example: "https://blossom.example/ab12cd34ef56.png"
                title:
                  type: string
                  example: "Copertina puntata 42"
                media_type:
                  type: string
                  description: MIME atteso. Se omesso, dedotto dal Content-Type della risposta.
                  enum: [audio/m4a, audio/mpeg, audio/mp3, audio/wav, video/mp4, image/png, image/jpeg, image/webp]
                  example: image/png
                duration_s:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Media creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '400':
          description: |
            Richiesta non valida: URL non consentito (schema/host non pubblico) oppure
            `media_type` (fornito o rilevato) fuori dai tipi accettati.
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'
        '409':
          description: Media gia' presente
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'
        '413':
          description: Contenuto oltre il limite di dimensione consentito
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'
        '502':
          description: Download fallito (URL irraggiungibile, errore remoto o troppi redirect)
          content:
            application/json:
              schema:
                $ref: '../shared/components.yaml#/components/schemas/Error'

  /media/{id}:
    get:
      operationId: get_media
      tags: [media]
      summary: Metadati del singolo media
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Metadati del media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItem'
        '404':
          description: Media non trovato (nessun corpo)

  /media/{id}/content:
    get:
      operationId: get_media_content
      tags: [media]
      summary: Byte del media (play inline o download)
      description: |
        Default inline; `?download=1|true|yes|on` -> allegato. media propaga il `302` di
        source verso lo storage in coll/prod (resta fuori dai byte); in dev relaia i byte.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: download
          in: query
          required: false
          description: Se valorizzato (1|true|yes|on), forza il download come allegato.
          schema:
            type: string
            example: "1"
      responses:
        '200':
          description: Byte del file (relay da source in dev); supporta Range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Contenuto parziale (risposta a una richiesta Range)
          headers:
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '302':
          description: Redirect verso URL pre-firmato (coll/prod)
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: Media non trovato (nessun corpo)

components:
  securitySchemes:
    ApiKeyAuth:
      $ref: '../shared/components.yaml#/components/securitySchemes/ApiKeyAuth'
  schemas:
    MediaItem:
      type: object
      required: [id, title, filename, media_type, created_at_s, status, content_url, download_url]
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Puntata pilota"
        filename:
          type: string
          example: "2024-01-puntata-pilota.m4a"
        media_type:
          type: string
          example: "audio/m4a"
        size_bytes:
          type: integer
          nullable: true
        duration_s:
          type: integer
          nullable: true
        created_at_s:
          type: integer
          example: 1700000000
        status:
          type: string
          enum: [ready, processing, error]
        content_url:
          type: string
          description: URL (relativo) dei byte inline, per il player.
          example: "/v0/media/1/content"
        download_url:
          type: string
          description: URL (relativo) dei byte come allegato.
          example: "/v0/media/1/content?download=1"
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    MediaPagedResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        pagination:
          $ref: '../shared/components.yaml#/components/schemas/PaginationMeta'
