# Reverse-proxy per host: UN container nginx che instrada /<dominio>/ ai container-dominio
# sulla rete docker condivisa 'mediamgr'. La nginx.conf e' generata da gen-nginx-conf.sh.
# Pubblica PROXY_HTTP_PORT (default 80) e, per HTTPS, PROXY_HTTPS_PORT (default 443).
#
# TLS: generare la conf con PROXY_TLS=1 (vedi gen-nginx-conf.sh) e mettere i certificati in
# PROXY_CERTS_DIR (default ./certs) come fullchain.pem + privkey.pem. Senza TLS la conf non
# ha il server :443 e la porta 443 pubblicata resta semplicemente inutilizzata (innocua).
# Runbook di emissione (Let's Encrypt via DuckDNS, DNS-01) in deploy/README.md.
services:
  proxy:
    image: nginx:alpine
    container_name: mediamgr-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROXY_CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      - ${PROXY_ACME_WEBROOT:-./certbot-www}:/var/www/certbot:ro
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    networks:
      - mediamgr
    restart: unless-stopped

networks:
  mediamgr:
    external: true
