# === FILE GENERATO da deploy/proxy/gen-nginx-conf.sh — non editare a mano. ===
# Reverse-proxy per host: instrada /v0/<dominio>/ al container <dominio>:8080
# sulla rete docker interna 'mediamgr' (risoluzione nomi a runtime via DNS Docker).

# Schema ESTERNO: quello con cui il client raggiunge il mondo, non quello con cui noi
# riceviamo la richiesta. Davanti a questo proxy puo' essercene un altro che termina il
# TLS (l'nginx di sistema) e ci parla in http: sovrascrivendo X-Forwarded-Proto con
# $scheme l'app vedrebbe SEMPRE http e comporrebbe URL assoluti sbagliati — un feed con
# <atom:link rel=self> in http finisce cosi' su Podcast Index. Quindi si PROPAGA il
# valore ricevuto, e si usa $scheme solo quando non c'e' nessuno davanti.
map $http_x_forwarded_proto $proto_esterno {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
# TLS non attivo (PROXY_TLS!=1): tutto il traffico su :80.
server {
    listen 80;
    server_name _;
    client_max_body_size 300M;
    resolver 127.0.0.11 valid=10s;   # DNS interno di Docker

    location = /v0/audio {
        set $up_audio audio:8080;
        proxy_pass http://$up_audio$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
    }

    location /v0/audio/ {
        set $up_audio audio:8080;
        proxy_pass http://$up_audio$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location = /v0/content {
        set $up_content content:8080;
        proxy_pass http://$up_content$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
    }

    location /v0/content/ {
        set $up_content content:8080;
        proxy_pass http://$up_content$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location = /v0/feed {
        set $up_feed feed:8080;
        proxy_pass http://$up_feed$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
    }

    location /v0/feed/ {
        set $up_feed feed:8080;
        proxy_pass http://$up_feed$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location = /v0/media {
        set $up_media media:8080;
        proxy_pass http://$up_media$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
    }

    location /v0/media/ {
        set $up_media media:8080;
        proxy_pass http://$up_media$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_esterno;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location = / {
        default_type text/plain;
        return 200 "media-manager reverse-proxy. domini pubblici: audio content feed media\n";
    }
    location / { return 404; }
}
